services:
  - type: web
    name: ca-portal-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/verify
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string here
      - key: SECRET_KEY
        generateValue: true
      - key: PORTAL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
